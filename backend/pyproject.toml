[project]
name = "email-report-analysis"
version = "0.1.0"
description = "AI-powered email report analysis with trend detection and WhatsApp alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "scipy>=1.14.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.10.0",
    "imapclient>=3.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.119.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
